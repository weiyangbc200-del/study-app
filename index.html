<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>戰力診斷中心</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root { --cyan: #22d3ee; }
        body { background-color: #000; color: #fff; font-family: -apple-system, system-ui, sans-serif; overflow: hidden; margin: 0; }
        .bg-img { background-size: cover; background-position: center; position: fixed; inset: 0; z-index: -10; opacity: 0.4; transition: 0.5s; background-image: url('https://images.unsplash.com/photo-1542051841857-5f90071e7989?q=80&w=2070'); }
        .glass { background: rgba(255, 255, 255, 0.08); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.1); border-radius: 20px; }
        .tab-active { color: var(--cyan); text-shadow: 0 0 10px rgba(34, 211, 238, 0.5); }
        .scroll-view { height: calc(100vh - 95px); overflow-y: auto; padding: 20px; padding-bottom: 120px; }
        .no-sb::-webkit-scrollbar { display: none; }
        
        /* 報告與分段 */
        .report-content { line-height: 1.8; color: #e5e7eb; font-size: 0.95rem; white-space: pre-wrap; }
        .report-content b { color: var(--cyan); font-weight: bold; }
        .report-content h3 { color: var(--cyan); font-weight: 800; border-left: 3px solid var(--cyan); padding-left: 8px; margin: 15px 0 10px 0; font-size: 1.1rem; }

        /* 月曆格式 */
        .calendar-container { max-width: 340px; margin: 0 auto; }
        .calendar-grid { display: grid !important; grid-template-columns: repeat(7, 1fr) !important; gap: 5px; text-align: center; }
        .day-cell { aspect-ratio: 1; display: flex; align-items: center; justify-content: center; border-radius: 50%; font-size: 13px; cursor: pointer; color: #888; }
        .day-selected { background: var(--cyan) !important; color: #000 !important; font-weight: bold; }
        .day-today { border: 1.5px solid var(--cyan); color: var(--cyan); }

        /* 計時器圓環 */
        .timer-circle { position: relative; width: 250px; height: 250px; margin: 0 auto; display: flex; align-items: center; justify-content: center; }
        .progress-ring { transform: rotate(-90deg); width: 250px; height: 250px; }
        .progress-ring-circle { transition: stroke-dashoffset 0.3s; transform-origin: 50% 50%; stroke-linecap: round; }

        nav { position: fixed; bottom: 0; left: 0; right: 0; height: 95px; background: rgba(0,0,0,0.9); display: flex; justify-content: space-around; padding-bottom: 25px; border-top: 1px solid rgba(255,255,255,0.1); z-index: 100; }
        .tab-btn { color: #555; display: flex; flex-direction: column; align-items: center; font-size: 10px; padding-top: 15px; border: none; background: none; width: 20%; cursor: pointer; }
        
        textarea, input { background: rgba(0,0,0,0.3) !important; border: 1px solid rgba(255,255,255,0.1) !important; color: white !important; outline: none !important; }
        button:active { transform: scale(0.95); opacity: 0.8; }
    </style>
</head>
<body class="no-sb">
    <div id="main-bg" class="bg-img"></div>
    <div class="fixed inset-0 bg-black/40 -z-5"></div>

    <div id="app">
        <main id="content" class="scroll-view no-sb"></main>
        <nav id="app-tab-bar">
            <button data-tab="0" class="tab-btn"><i class="bi bi-calendar3 text-xl mb-1"></i>日程</button>
            <button data-tab="1" class="tab-btn"><i class="bi bi-timer text-xl mb-1"></i>專專</button>
            <button data-tab="2" class="tab-btn"><i class="bi bi-bar-chart-fill text-xl mb-1"></i>看板</button>
            <button data-tab="3" class="tab-btn"><i class="bi bi-clock-history text-xl mb-1"></i>學歷</button>
            <button data-tab="4" class="tab-btn"><i class="bi bi-gear text-xl mb-1"></i>設定</button>
        </nav>
    </div>

    <div id="sheet" class="fixed inset-0 bg-black/80 z-[200] hidden flex items-end">
        <div class="glass w-full p-6 rounded-t-3xl border-t border-white/20">
            <h3 class="text-center font-bold mb-5">任務管理</h3>
            <input id="sheet-input" class="w-full p-4 rounded-xl mb-4" placeholder="要做什麼？">
            <div class="flex gap-2 mb-6">
                <button id="st-Study" class="flex-1 py-2 rounded-lg border border-white/10 text-xs">讀書任務</button>
                <button id="st-Life" class="flex-1 py-2 rounded-lg border border-white/10 text-xs">生活計劃</button>
            </div>
            <button id="btn-save-sheet" class="w-full py-4 bg-cyan-600 rounded-xl font-bold mb-3 text-white">儲存</button>
            <button id="btn-del-sheet" class="w-full py-4 text-red-500 font-bold">刪除日程</button>
            <button id="btn-close-sheet" class="w-full py-2 text-gray-500 text-sm">取消</button>
        </div>
    </div>

    <script>
        // --- 1. 核心狀態 ---
        let state = {
            tab: 2,
            apiKey: localStorage.getItem('apiKey') || '',
            bgURL: localStorage.getItem('bgURL') || 'https://images.unsplash.com/photo-1542051841857-5f90071e7989?q=80&w=2070',
            goals: JSON.parse(localStorage.getItem('goals')) || [
                {subject:"行政法", total:50, completed:0}, {subject:"政治學", total:30, completed:0},
                {subject:"行政學", total:40, completed:0}, {subject:"公共政策", total:20, completed:0}
            ],
            law: parseInt(localStorage.getItem('law')) || 0,
            events: JSON.parse(localStorage.getItem('events')) || [],
            dailyLogs: JSON.parse(localStorage.getItem('dailyLogs')) || {},
            done: parseInt(localStorage.getItem('pomodoroDone')) || 0,
            failed: parseInt(localStorage.getItem('pomodoroFailed')) || 0,
            selectedDate: new Date(),
            reflection: '', reportMsg: '戰略報告準備中...', focusMsg: '全職考生，你沒有退路。', loading: false,
            isActive: false, timeLeft: 1500, totalTime: 1500, focusTask: '', editingId: null, sheetType: 'Study'
        };

        function sync() {
            localStorage.setItem('apiKey', state.apiKey); localStorage.setItem('bgURL', state.bgURL);
            localStorage.setItem('goals', JSON.stringify(state.goals)); localStorage.setItem('law', state.law);
            localStorage.setItem('events', JSON.stringify(state.events)); localStorage.setItem('dailyLogs', JSON.stringify(state.dailyLogs));
            localStorage.setItem('pomodoroDone', state.done); localStorage.setItem('pomodoroFailed', state.failed);
        }

        // --- 2. AI 請求 ---
        async function fetchAI(type, reason = "") {
            if (!state.apiKey) return;
            if (type === 'report') state.loading = true; render();
            const now = new Date();
            const currentTimeStr = now.toLocaleString();
            const todayKey = now.toISOString().split('T')[0].replace(/-/g,'');
            const todayTasks = state.events.filter(e => e.date.startsWith(todayKey) && e.isDone).map(e => e.title).join(',');
            const getPK = (n) => { let x = new Date(); x.setDate(x.getDate()-n); return x.toISOString().split('T')[0].replace(/-/g,''); };
            const histLog = `昨日：${state.dailyLogs[getPK(1)]?.summary || "無"}, 前日：${state.dailyLogs[getPK(2)]?.summary || "無"}`;

            let prompt = type === 'jab' ? 
            `身分：高冷嚴厲教官。分析時間：${currentTimeStr}。任務狀態：${reason}。成功：${state.done}。請給予一句 20 字內的反饋（請使用 Markdown **粗體**）。` :
            `【身分】高考全職考生，28歲，之前賺的存款都快花光了。\n【分析當下時間】：${currentTimeStr}\n【今日數據】：完課：${todayTasks}。專注成功：${state.done}。失敗：${state.failed}。\n【使用者本日反思】：${state.reflection || "（無）"}\n【歷史校正資料】：${histLog}。\n【要求】：\n1. 產出 200 字內深度學習診斷。點出不足與做得好的地方。Markdown **粗體** 關鍵字。\n2. 回應使用者的「本日反思」並對話。\n3. 進行性格與習性分析。\n4. 會根據當下時間給予適當的回饋\n5. 會參考過去五天的histLog給予整體回饋\n6. 目標在督促學習和令人有動力學習\n【結尾格式】：\nSCORE: [0-100]\nLOG: [50字今日總結]\nCHAR: [性格習性分析，不超過100字]`;

            try {
                const res = await fetch(`https://generativelanguage.googleapis.com/v1/models/gemini-2.5-flash:generateContent?key=${state.apiKey}`, {
                    method: 'POST', body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
                });
                const data = await res.json();
                const fullMsg = data.candidates[0].content.parts[0].text;
                if (type === 'report') {
                    const comps = fullMsg.split("SCORE:");
                    state.reportMsg = (comps[0] || fullMsg).replace(/### (.*?)\n/g, '<h3>$1</h3>').replace(/\*\*(.*?)\*\*/g, '<b>$1</b>');
                    if (comps.length > 1) {
                        const scComp = comps[1].split("LOG:");
                        state.dailyLogs[todayKey] = { score: parseInt(scComp[0].trim()), summary: scComp[1].split("CHAR:")[0].trim(), char: scComp[1].split("CHAR:")[1]?.trim() };
                        state.reflection = '';
                    }
                } else { state.focusMsg = fullMsg.replace(/\*\*(.*?)\*\*/g, '<b>$1</b>'); }
            } catch (e) { state.reportMsg = "連線失敗。"; }
            state.loading = false; sync(); render();
        }

        // --- 3. 渲染視圖 ---
        function render() {
            document.getElementById('main-bg').style.backgroundImage = `url('${state.bgURL}')`;
            const container = document.getElementById('content');
            const selKey = state.selectedDate.toISOString().split('T')[0].replace(/-/g,'');

            if (state.tab === 0) { // 日程
                container.innerHTML = `<div class="glass p-4 mb-6">${getCalendarHTML()}</div><div class="space-y-4">
                    ${state.events.filter(e => e.date.startsWith(selKey)).map(e => `
                        <div class="glass p-4 flex items-center gap-4">
                            <i class="bi ${e.isDone?'bi-check-circle-fill text-cyan-400':'bi-circle text-gray-500'} text-2xl" onclick="toggleDone('${e.id}')"></i>
                            <div class="flex-1" onclick="openSheet('${e.id}')"><p class="font-bold ${e.isDone?'line-through text-gray-500':''}">${e.title}</p></div>
                        </div>`).join('')}
                    <button class="w-full py-5 border-2 border-dashed border-white/10 rounded-2xl mt-10 text-gray-500 font-bold" onclick="openSheet(null)">+ 加入日程規劃</button></div>`;
            }
            else if (state.tab === 1) { // 專注
                const circ = 2 * Math.PI * 45; const offset = circ - (state.timeLeft / state.totalTime) * circ;
                container.innerHTML = `
                    <div class="flex flex-col items-center pt-8">
                        <input id="f-task" class="w-full text-center p-4 rounded-xl mb-12 glass font-bold" placeholder="攻克目標..." value="${state.focusTask}">
                        <div class="timer-circle mb-10">
                            <svg class="progress-ring" viewBox="0 0 100 100"><circle cx="50" cy="50" r="45" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="4"/><circle class="progress-ring-circle" cx="50" cy="50" r="45" fill="none" stroke="#22d3ee" stroke-width="4" stroke-dasharray="${circ}" stroke-dashoffset="${offset}"/></svg>
                            <span class="absolute text-6xl font-mono font-bold">${Math.floor(state.timeLeft/60)}:${String(state.timeLeft%60).padStart(2,'0')}</span>
                        </div>
                        <div class="report-content italic text-center px-10 mb-10 h-10 text-cyan-400">${state.focusMsg}</div>
                        <div class="flex gap-10 items-center">
                            <button id="btn-minus" class="bi bi-dash-circle text-3xl text-gray-500"></button>
                            <button id="btn-toggle-f" class="bg-cyan-600 px-12 py-3 rounded-2xl font-bold shadow-lg">${state.isActive?'暫停':'開始'}</button>
                            <button id="btn-plus" class="bi bi-plus-circle text-3xl text-gray-500"></button>
                        </div>
                        <button id="btn-abandon" class="mt-16 text-red-500 opacity-40 text-xs font-bold">放棄</button>
                    </div>`;
                bindTimerButtons();
            }
            else if (state.tab === 2) { // 看板
                container.innerHTML = `
                    <div class="flex justify-between items-end mb-6"><h1 class="text-3xl font-black italic tracking-tighter">戰力診斷</h1><span class="text-red-500 font-bold text-xs">2026/01/31</span></div>
                    <textarea id="ref-in" class="w-full p-4 rounded-xl h-28 mb-6 text-sm glass" placeholder="向教官報告今天的心情...">${state.reflection}</textarea>
                    <div class="glass p-5 border-l-4 border-cyan-400 mb-8 bg-black/50"><div class="report-content">${state.loading?'正在診斷...':state.reportMsg}</div></div>
                    <div class="glass p-5 space-y-5 mb-8">
                        ${state.goals.map((g,i) => `<div class="flex justify-between text-sm items-center"><span>${g.subject}</span><div class="flex items-center gap-5"><button onclick="adjG(${i},-1)">-</button><span class="w-16 text-center font-bold text-cyan-400">${g.completed}/${g.total}</span><button onclick="adjG(${i},1)">+</button></div></div>`).join('')}
                        <div class="flex justify-between text-sm items-center border-t border-white/5 pt-5"><span>法學緒論</span><div class="flex items-center gap-5"><button onclick="adjL(-25)">-</button><span class="w-16 text-center font-bold text-cyan-400">${state.law}/100</span><button onclick="adjL(25)">+</button></div></div>
                    </div>
                    <button id="btn-ai-report" class="w-full py-5 bg-cyan-600/40 rounded-2xl font-black shadow-2xl">產出戰術診斷報告</button>`;
                document.getElementById('ref-in').oninput = (e) => state.reflection = e.target.value;
                document.getElementById('btn-ai-report').onclick = () => fetchAI('report');
            }
            else if (state.tab === 3) { // 學歷
                const log = state.dailyLogs[selKey];
                container.innerHTML = `<div class="glass p-4 mb-6">${getCalendarHTML()}</div>
                    ${log ? `<div class="glass p-6 space-y-6"><div class="flex justify-between items-center"><span class="text-gray-400 font-bold uppercase text-xs">本日評分</span><span class="text-4xl text-green-400 font-black">${log.score}</span></div><p class="text-sm text-gray-200 leading-relaxed">${log.summary}</p><p class="text-sm italic text-cyan-200/60 border-t border-white/5 pt-4">${log.char || "無資料"}</p></div>` : `<p class="text-center text-gray-600 py-20 italic">無數據</p>`}`;
            }
            else if (state.tab === 4) { // 設定
                container.innerHTML = `<h2 class="text-xl font-bold mb-10 italic">設定</h2><div class="space-y-8">
                    <div><label class="text-[10px] text-gray-500 font-bold mb-2 block uppercase">Gemini API Key</label><input type="password" onchange="state.apiKey=this.value;sync()" class="w-full p-4 glass rounded-xl font-mono text-sm" value="${state.apiKey}"></div>
                    <div><label class="text-[10px] text-gray-500 font-bold mb-2 block uppercase">背景圖片 URL</label><input onchange="state.bgURL=this.value;sync();render()" class="w-full p-4 glass rounded-xl text-xs" value="${state.bgURL}"></div></div>`;
            }
            updateTabs();
        }

        // --- 4. 輔助函數 ---
        function tab(i) {
            if(state.isActive && i !== 1) abandon();
            state.tab = i;
            render();
        }
        function getCalendarHTML() {
            const d = state.selectedDate; const y = d.getFullYear(), m = d.getMonth();
            const first = new Date(y, m, 1).getDay(), days = new Date(y, m + 1, 0).getDate();
            let g = `<div class="calendar-grid">`;
            ['日','一','二','三','四','五','六'].forEach(w => g += `<div class="text-[10px] text-gray-600 font-bold mb-2">${w}</div>`);
            for (let i = 0; i < first; i++) g += `<div></div>`;
            for (let i = 1; i <= days; i++) {
                const isS = d.getDate() === i; const isT = new Date().toDateString() === new Date(y,m,i).toDateString();
                g += `<div onclick="selectDay(${i})" class="day-cell ${isS?'day-selected':''} ${isT?'day-today':''}">$ {i}</div>`.replace("$ {i}", i);
            }
            return `<div class="calendar-container"><div class="flex justify-between items-center mb-5 px-2"><i class="bi bi-chevron-left" onclick="moveMonth(-1)"></i><span class="font-bold text-sm">${y}年 ${m+1}月</span><i class="bi bi-chevron-right" onclick="moveMonth(1)"></i></div>${g}</div></div>`;
        }
        function moveMonth(v) { state.selectedDate.setMonth(state.selectedDate.getMonth() + v); render(); }
        function selectDay(d) { state.selectedDate.setDate(d); render(); }
        function adjG(i,v) { state.goals[i].completed = Math.max(0, state.goals[i].completed + v); sync(); render(); }
        function adjL(v) { state.law = Math.max(0, Math.min(100, state.law + v)); sync(); render(); }
        function toggleDone(id) { const e = state.events.find(ev=>ev.id===id); e.isDone = !e.isDone; sync(); render(); }
        
        function openSheet(id) {
            state.editingId = id; document.getElementById('sheet').classList.remove('hidden');
            if(id) {
                const e = state.events.find(ev=>ev.id===id);
                document.getElementById('sheet-input').value = e.title; state.sheetType = e.type;
                document.getElementById('sheet-del').style.display = "block";
            } else {
                document.getElementById('sheet-input').value = ""; state.sheetType = 'Study';
                document.getElementById('sheet-del').style.display = "none";
            }
            updateSheetButtons();
        }
        function closeSheet() { document.getElementById('sheet').classList.add('hidden'); }
        function setSheetType(t) { state.sheetType = t; updateSheetButtons(); }
        function updateSheetButtons() {
            document.getElementById('st-Study').className = `flex-1 py-2 rounded-lg border text-xs ${state.sheetType==='Study'?'bg-blue-600 border-blue-400':'border-white/10'}`;
            document.getElementById('st-Life').className = `flex-1 py-2 rounded-lg border text-xs ${state.sheetType==='Life'?'bg-orange-600 border-orange-400':'border-white/10'}`;
        }
        function saveSheet() {
            const t = document.getElementById('sheet-input').value; if(!t) return;
            if(state.editingId) {
                const e = state.events.find(ev=>ev.id===state.editingId); e.title = t; e.type = state.sheetType;
            } else {
                state.events.unshift({id: Date.now().toString(), title: t, date: state.selectedDate.toISOString().replace(/\D/g,'').slice(0,8)+"0000", isDone: false, type: state.sheetType});
            }
            sync(); closeSheet(); render();
        }
        function deleteSheet() { state.events = state.events.filter(e=>e.id!==state.editingId); sync(); closeSheet(); render(); }

        // --- 5. 計時器加固 ---
        let timer;
        function bindTimerButtons() {
            document.getElementById('btn-toggle-f').onclick = toggleF;
            document.getElementById('btn-minus').onclick = () => adjT(-300);
            document.getElementById('btn-plus').onclick = () => adjT(300);
            document.getElementById('btn-abandon').onclick = abandon;
            document.getElementById('f-task').oninput = (e) => state.focusTask = e.target.value;
        }

        function toggleF() {
            state.isActive = !state.isActive;
            if(state.isActive) {
                timer = setInterval(() => {
                    if(state.timeLeft > 0) { state.timeLeft--; render(); }
                    else { clearInterval(timer); state.isActive=false; state.done++; state.timeLeft=state.totalTime; fetchAI('jab', "完成任務"); sync(); render(); }
                }, 1000);
            } else { clearInterval(timer); }
            render();
        }
        function adjT(v) { if(!state.isActive) { state.totalTime = Math.max(60, state.totalTime + v); state.timeLeft = state.totalTime; render(); } }
        function abandon() {
            clearInterval(timer); state.isActive = false; state.failed++;
            state.events.unshift({id: Date.now().toString(), title: state.focusTask||"分心", date: new Date().toISOString().replace(/\D/g,'').slice(0,12), isDone: false, type: 'Study'});
            state.timeLeft = state.totalTime; fetchAI('jab', "放棄任務"); sync(); render();
        }

        function updateTabs() {
            document.querySelectorAll('.tab-btn').forEach(b => {
                const active = b.getAttribute('data-tab') == state.tab;
                b.className = `tab-btn ${active ? 'tab-active' : ''}`;
            });
        }

        // 初始化
        document.querySelectorAll('.tab-btn').forEach(b => {
            b.onclick = () => tab(parseInt(b.getAttribute('data-tab')));
        });
        document.getElementById('btn-save-sheet').onclick = saveSheet;
        document.getElementById('btn-del-sheet').onclick = deleteSheet;
        document.getElementById('btn-close-sheet').onclick = closeSheet;
        document.getElementById('st-Study').onclick = () => setSheetType('Study');
        document.getElementById('st-Life').onclick = () => setSheetType('Life');

        window.onload = render;
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>戰力診斷中心</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root { --cyan: #22d3ee; }
        body { background-color: #000; color: #fff; font-family: -apple-system, system-ui, sans-serif; margin: 0; padding: 0; overflow: hidden; }
        
        .bg-img { background-size: cover; background-position: center; position: fixed; inset: 0; z-index: -10; opacity: 0.4; transition: 0.5s; }
        .glass { background: rgba(255, 255, 255, 0.08); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.1); border-radius: 20px; }

        /* 月曆格式修正 */
        .calendar-container { max-width: 340px; margin: 0 auto; padding: 10px; }
        .calendar-grid { display: grid !important; grid-template-columns: repeat(7, 1fr) !important; gap: 4px; text-align: center; }
        .day-cell { width: 36px; height: 36px; margin: 0 auto; display: flex; align-items: center; justify-content: center; border-radius: 50%; font-size: 12px; cursor: pointer; }
        .day-selected { background: var(--cyan) !important; color: #000 !important; font-weight: bold; }
        .day-today { border: 1.5px solid var(--cyan); color: var(--cyan); }

        /* 番茄鐘格式固定 */
        .timer-circle { position: relative; width: 260px; height: 260px; margin: 0 auto; display: flex; align-items: center; justify-content: center; }
        .progress-ring { transform: rotate(-90deg); width: 260px; height: 260px; }
        .progress-ring-circle { transition: stroke-dashoffset 0.3s; transform-origin: 50% 50%; stroke-linecap: round; }

        /* 文字解析 */
        .report-content { line-height: 1.8; font-size: 14px; white-space: pre-wrap; color: #e5e7eb; }
        .report-content b { color: var(--cyan); font-weight: 700; }

        /* 導覽列 */
        nav { position: fixed; bottom: 0; left: 0; right: 0; height: 90px; background: rgba(0,0,0,0.92); display: flex; justify-content: space-around; padding-bottom: env(safe-area-inset-bottom); border-top: 1px solid rgba(255,255,255,0.1); z-index: 100; }
        .tab-btn { color: #666; display: flex; flex-direction: column; align-items: center; font-size: 10px; padding-top: 12px; border: none; background: none; width: 20%; }
        .tab-active { color: var(--cyan); text-shadow: 0 0 8px rgba(34, 211, 238, 0.4); }
        
        .scroll-view { height: calc(100vh - 90px); overflow-y: auto; padding: 20px; padding-bottom: 120px; }
        .scroll-view::-webkit-scrollbar { display: none; }
        textarea, input { background: rgba(0,0,0,0.3) !important; border: 1px solid rgba(255,255,255,0.1) !important; color: white !important; }
    </style>
</head>
<body>
    <div id="main-bg" class="bg-img"></div>
    <div class="fixed inset-0 bg-black/40 -z-5"></div>

    <div id="app">
        <main id="content" class="scroll-view"></main>
        <nav>
            <button onclick="switchTab(0)" id="t0" class="tab-btn"><i class="bi bi-calendar3 text-xl mb-1"></i>日程</button>
            <button onclick="switchTab(1)" id="t1" class="tab-btn"><i class="bi bi-timer text-xl mb-1"></i>專專</button>
            <button onclick="switchTab(2)" id="t2" class="tab-btn"><i class="bi bi-bar-chart-fill text-xl mb-1"></i>看板</button>
            <button onclick="switchTab(3)" id="t3" class="tab-btn"><i class="bi bi-clock-history text-xl mb-1"></i>學歷</button>
            <button onclick="switchTab(4)" id="t4" class="tab-btn"><i class="bi bi-gear text-xl mb-1"></i>設定</button>
        </nav>
    </div>

    <script>
        let state = {
            tab: 2,
            apiKey: localStorage.getItem('apiKey') || '',
            bgURL: localStorage.getItem('bgURL') || 'https://images.unsplash.com/photo-1542051841857-5f90071e7989?q=80&w=2070',
            law: parseInt(localStorage.getItem('law')) || 0,
            goals: JSON.parse(localStorage.getItem('goals')) || [
                {subject:"行政法", total:50, completed:0}, {subject:"政治學", total:30, completed:0},
                {subject:"行政學", total:40, completed:0}, {subject:"公共政策", total:20, completed:0}
            ],
            events: JSON.parse(localStorage.getItem('events')) || [],
            dailyLogs: JSON.parse(localStorage.getItem('dailyLogs')) || {},
            done: parseInt(localStorage.getItem('pomodoroDone')) || 0,
            failed: parseInt(localStorage.getItem('pomodoroFailed')) || 0,
            selectedDate: new Date(),
            reflection: '', reportMsg: '教官待命。請提交反思...', focusMsg: '全職考生，你沒有退路。',
            loading: false, isActive: false, timeLeft: 1500, totalTime: 1500, focusTask: ''
        };

        function sync() {
            localStorage.setItem('apiKey', state.apiKey);
            localStorage.setItem('bgURL', state.bgURL);
            localStorage.setItem('goals', JSON.stringify(state.goals));
            localStorage.setItem('law', state.law);
            localStorage.setItem('events', JSON.stringify(state.events));
            localStorage.setItem('dailyLogs', JSON.stringify(state.dailyLogs));
            localStorage.setItem('pomodoroDone', state.done);
            localStorage.setItem('pomodoroFailed', state.failed);
        }

        function renderCalendar() {
            const d = state.selectedDate;
            const year = d.getFullYear();
            const month = d.getMonth();
            const firstDay = new Date(year, month, 1).getDay();
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            const today = new Date();

            let grid = `<div class="calendar-grid">`;
            ['日','一','二','三','四','五','六'].forEach(w => grid += `<div class="text-[10px] text-gray-600 font-bold mb-2">${w}</div>`);
            for (let i = 0; i < firstDay; i++) grid += `<div></div>`;
            for (let i = 1; i <= daysInMonth; i++) {
                const isSel = d.getDate() === i;
                const isToday = today.getFullYear()===year && today.getMonth()===month && today.getDate()===i;
                grid += `<div onclick="selectDay(${i})" class="day-cell ${isSel?'day-selected':''} ${isToday?'day-today':''}">${i}</div>`;
            }
            grid += `</div>`;

            return `<div class="calendar-container">
                <div class="flex justify-between items-center mb-5 px-2">
                    <button onclick="changeMonth(-1)" class="bi bi-chevron-left text-gray-500"></button>
                    <span class="font-bold text-sm">${year}年 ${month+1}月</span>
                    <button onclick="changeMonth(1)" class="bi bi-chevron-right text-gray-500"></button>
                </div>
                ${grid}
            </div>`;
        }

        async function fetchAI(type, reason="") {
            if (!state.apiKey) return alert("請先填寫 API Key");
            if (type === 'report') state.loading = true; render();
            const now = new Date();
            const currentTimeStr = now.toLocaleString();
            const todayKey = now.toISOString().split('T')[0].replace(/-/g,'');
            const todayTasks = state.events.filter(e => e.date.startsWith(todayKey) && e.isDone).map(e => e.title).join(',');
            const getPK = (n) => { let x = new Date(); x.setDate(x.getDate()-n); return x.toISOString().split('T')[0].replace(/-/g,''); };
            const histLog = `昨日：${state.dailyLogs[getPK(1)]?.summary || "無"}, 前日：${state.dailyLogs[getPK(2)]?.summary || "無"}`;

            let prompt = type==='jab' ? `身分：高冷嚴厲教官。分析時間：${currentTimeStr}。任務狀態：${reason}。成功：${state.done}。請給予一句 20 字內的反饋（請使用 Markdown **粗體**）。` :
            `【身分】高考全職考生，28歲，之前賺的存款都快花光了。\n【分析當下時間】：${currentTimeStr}\n【今日數據】：完課：${todayTasks}。專注成功：${state.done}。失敗：${state.failed}。\n【使用者本日反思】：${state.reflection || "（無）"}\n【歷史校正資料】：${histLog}。\n【要求】：\n1. 產出 200 字內深度學習診斷。點出不足與做得好的地方。Markdown **粗體** 關鍵字。\n2. 回應使用者的「本日反思」並對話。\n3. 進行性格與習性分析。\n4. 會根據當下時間給予適當的回饋\n5. 會參考過去五天的histLog給予整體回饋\n6. 目標在督促學習和令人有動力學習\n【結尾格式】：\nSCORE: [0-100]\nLOG: [50字今日總結]\nCHAR: [性格習性分析，不超過100字]`;

            try {
                const res = await fetch(`https://generativelanguage.googleapis.com/v1/models/gemini-2.5-flash:generateContent?key=${state.apiKey}`, {
                    method: 'POST', body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
                });
                const data = await res.json();
                const fullMsg = data.candidates[0].content.parts[0].text;
                if (type === 'report') {
                    const comps = fullMsg.split("SCORE:");
                    state.reportMsg = (comps[0] || fullMsg).replace(/\*\*(.*?)\*\*/g, '<b>$1</b>');
                    if (comps.length > 1) {
                        const scComp = comps[1].split("LOG:");
                        const score = parseInt(scComp[0].trim());
                        const logComp = scComp[1].split("CHAR:");
                        state.dailyLogs[todayKey] = { score, summary: logComp[0]?.trim(), char: logComp[1]?.trim() };
                        state.reflection = '';
                    }
                } else { state.focusMsg = fullMsg.replace(/\*\*(.*?)\*\*/g, '<b>$1</b>'); }
            } catch (e) { state.reportMsg = "分析失敗。"; }
            state.loading = false; sync(); render();
        }

        function render() {
            document.getElementById('main-bg').style.backgroundImage = `url('${state.bgURL}')`;
            const container = document.getElementById('content');
            const selKey = state.selectedDate.toISOString().split('T')[0].replace(/-/g,'');

            if (state.tab === 0) { // 日程
                container.innerHTML = `
                    <div class="glass mb-6 p-4">${renderCalendar()}</div>
                    <div class="space-y-4">
                        ${state.events.filter(e => e.date.startsWith(selKey)).map(e => `
                            <div class="glass p-4 flex items-center gap-4">
                                <i onclick="toggleDone('${e.id}')" class="bi ${e.isDone?'bi-check-circle-fill text-cyan-400':'bi-circle text-gray-500'} text-2xl"></i>
                                <div class="flex-1">
                                    <p class="font-bold text-sm ${e.isDone?'line-through text-gray-500':''}">${e.title}</p>
                                    <p class="text-[9px] text-gray-500 uppercase mt-1">Combat Task</p>
                                </div>
                                <button onclick="deleteEv('${e.id}')" class="text-red-900 opacity-50 px-2"><i class="bi bi-trash3"></i></button>
                            </div>`).join('')}
                        <button onclick="addEv()" class="w-full py-5 border-2 border-dashed border-white/10 rounded-2xl text-gray-500 font-bold">+ 加入戰術日程</button>
                    </div>`;
            }
            else if (state.tab === 1) { // 專注
                const radius = 45;
                const circ = 2 * Math.PI * radius;
                const offset = circ - (state.timeLeft / state.totalTime) * circ;
                container.innerHTML = `
                    <div class="flex flex-col items-center pt-5">
                        <h2 class="text-lg font-bold mb-8 italic opacity-50 tracking-widest uppercase">Focus Command</h2>
                        <input id="f-task" class="w-full text-center p-4 rounded-xl mb-12 glass font-bold" placeholder="攻克目標..." value="${state.focusTask}">
                        
                        <div class="timer-circle mb-10">
                            <svg class="progress-ring" viewBox="0 0 100 100">
                                <circle cx="50" cy="50" r="45" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="3"/>
                                <circle class="progress-ring-circle" cx="50" cy="50" r="45" fill="none" stroke="#22d3ee" stroke-width="3" stroke-dasharray="${circ}" stroke-dashoffset="${offset}"/>
                            </svg>
                            <span class="absolute text-6xl font-mono font-black tracking-tighter text-cyan-400">
                                ${Math.floor(state.timeLeft/60)}:${String(state.timeLeft%60).padStart(2,'0')}
                            </span>
                        </div>

                        <div class="report-content italic text-center text-cyan-400 px-10 h-12 mb-10 flex items-center justify-center">${state.focusMsg}</div>
                        
                        <div class="flex items-center gap-12">
                            <button onclick="adjT(-300)" class="bi bi-dash-circle text-2xl text-gray-600 active:scale-90 transition-transform"></button>
                            <button onclick="toggleF()" class="bg-cyan-600 w-20 h-20 rounded-full flex items-center justify-center text-3xl shadow-xl shadow-cyan-900/30 active:scale-95 transition-all">
                                <i class="bi ${state.isActive?'bi-pause-fill':'bi-play-fill'}"></i>
                            </button>
                            <button onclick="adjT(300)" class="bi bi-plus-circle text-2xl text-gray-600 active:scale-90 transition-transform"></button>
                        </div>
                        <button onclick="abandon()" class="mt-14 text-red-500 opacity-40 text-[10px] font-bold tracking-widest border-b border-red-500/20 pb-1">ABANDON MISSION</button>
                    </div>`;
            }
            else if (state.tab === 2) { // 看板
                container.innerHTML = `
                    <div class="flex justify-between items-end mb-6">
                        <h1 class="text-3xl font-black italic tracking-tighter">戰力診斷</h1>
                        <span class="text-red-500 font-bold text-xs mb-1 tracking-tighter">2026/01/31 決戰</span>
                    </div>
                    <textarea oninput="state.reflection=this.value" class="w-full p-4 rounded-2xl glass h-28 mb-6 text-sm leading-relaxed" placeholder="報告反思...">${state.reflection}</textarea>
                    <div class="glass p-5 border-l-4 border-cyan-400 mb-8 bg-black/50 overflow-hidden">
                        <div class="flex justify-between text-[8px] text-gray-600 font-bold mb-3 tracking-widest uppercase"><span>Intelligence Report</span><span>${state.time || 'N/A'}</span></div>
                        <div class="report-content">${state.loading ? '<span class="animate-pulse">運算中...</span>' : state.reportMsg}</div>
                    </div>
                    <div class="glass p-5 space-y-5 mb-8">
                        ${state.goals.map((g,i) => `<div class="flex justify-between text-sm items-center"><span class="font-bold text-gray-300">${g.subject}</span><div class="flex items-center gap-5"><button onclick="addGoal(${i},-1)">-</button><span class="w-16 text-center font-black text-cyan-400 text-lg">${g.completed}/${g.total}</span><button onclick="addGoal(${i},1)">+</button></div></div>`).join('')}
                        <div class="flex justify-between text-sm items-center border-t border-white/5 pt-5"><span class="font-bold text-gray-300">法學緒論</span><div class="flex items-center gap-5"><button onclick="addLaw(-25)">-</button><span class="w-16 text-center font-black text-cyan-400 text-lg">${state.law}/100</span><button onclick="addLaw(25)">+</button></div></div>
                    </div>
                    <button onclick="fetchAI('report')" class="w-full py-5 bg-cyan-600/40 hover:bg-cyan-600/60 rounded-2xl font-black tracking-widest shadow-2xl active:scale-95 transition-all">產出戰術診斷報告</button>`;
            }
            else if (state.tab === 3) { // 學歷
                const log = state.dailyLogs[selKey];
                container.innerHTML = `
                    <div class="glass p-4 mb-6">${renderCalendar()}</div>
                    ${log ? `<div class="glass p-6 space-y-8">
                        <div class="flex justify-between items-center"><span class="text-gray-500 font-black text-xs uppercase tracking-widest">Daily Score</span><span class="text-5xl font-black text-green-400">${log.score}</span></div>
                        <div class="space-y-4">
                            <div><p class="text-[9px] text-gray-600 font-bold mb-1 uppercase tracking-widest">Command Summary</p><p class="text-sm leading-relaxed text-gray-200">${log.summary}</p></div>
                            <div class="border-t border-white/5 pt-4 italic text-cyan-200/60"><p class="text-[9px] text-gray-600 font-bold mb-1 uppercase tracking-widest">Psych Analysis</p><p class="text-sm leading-relaxed">${log.char || "尚未分析"}</p></div>
                        </div>
                        <div class="border-t border-white/5 pt-6">
                            <p class="text-[8px] text-gray-600 font-bold mb-4 uppercase tracking-widest">Operation Timeline</p>
                            <div class="space-y-3">
                                ${state.events.filter(e=>e.date.startsWith(selKey)).map(e=>`<div class="flex justify-between text-[11px] font-mono"><span class="text-gray-400">${e.title}</span><span class="${e.isDone?'text-green-500':'text-red-800'}">${e.isDone?'COMPLETED':'FAILED'}</span></div>`).join('')}
                            </div>
                        </div>
                    </div>` : `<div class="text-center py-20 text-gray-600 italic font-mono text-xs">NO INTEL ON THIS DATE</div>`}`;
            }
            else if (state.tab === 4) { // 設定
                container.innerHTML = `
                    <h2 class="text-2xl font-black mb-10 italic tracking-tighter">軍情室設定</h2>
                    <div class="space-y-10">
                        <div><label class="text-[10px] text-gray-600 font-black uppercase mb-3 block tracking-widest">AI Access Token (Key)</label><input type="password" onchange="state.apiKey=this.value;sync()" class="w-full p-5 glass rounded-2xl font-mono text-xs" value="${state.apiKey}"></div>
                        <div><label class="text-[10px] text-gray-600 font-black uppercase mb-3 block tracking-widest">Visual Backdrop URL</label><input onchange="state.bgURL=this.value;sync();render()" class="w-full p-5 glass rounded-2xl text-[10px]" value="${state.bgURL}"></div>
                    </div>`;
            }
            for(let i=0; i<5; i++) document.getElementById('t'+i).className = `tab-btn ${state.tab===i?'tab-active':''}`;
        }

        function switchTab(i) { if(state.isActive && i!==1) abandon(); state.tab=i; render(); }
        function changeMonth(v) { state.selectedDate.setMonth(state.selectedDate.getMonth() + v); render(); }
        function selectDay(d) { state.selectedDate.setDate(d); render(); }
        function addGoal(i, v) { state.goals[i].completed = Math.max(0, state.goals[i].completed + v); sync(); render(); }
        function addLaw(v) { state.law = Math.max(0, Math.min(100, state.law + v)); sync(); render(); }
        function toggleDone(id) { const idx=state.events.findIndex(e=>e.id===id); state.events[idx].isDone = !state.events[idx].isDone; sync(); render(); }
        function deleteEv(id) { state.events = state.events.filter(e=>e.id!==id); sync(); render(); }
        function addEv() { const t=prompt("新增日程任務："); if(t){ state.events.unshift({id:Date.now().toString(), title:t, date:state.selectedDate.toISOString().replace(/\D/g,'').slice(0,8)+"0000", isDone:false}); sync(); render(); }}

        let timer;
        function toggleF() {
            state.isActive = !state.isActive;
            state.focusTask = document.getElementById('f-task')?.value || "自主攻堅任務";
            if(state.isActive) {
                timer = setInterval(() => {
                    if(state.timeLeft > 0) { state.timeLeft--; render(); }
                    else { clearInterval(timer); state.isActive=false; state.done++; state.timeLeft=state.totalTime; fetchAI('jab', "任務完成"); sync(); render(); }
                }, 1000);
            } else clearInterval(timer);
            render();
        }
        function adjT(v) { if(!state.isActive) { state.totalTime = Math.max(60, state.totalTime + v); state.timeLeft = state.totalTime; render(); } }
        function abandon() { 
            clearInterval(timer); state.isActive=false; state.failed++; 
            state.events.unshift({id:Date.now().toString(), title:state.focusTask||"分心任務", date:new Date().toISOString().replace(/\D/g,'').slice(0,12), isDone:false});
            state.timeLeft=state.totalTime; fetchAI('jab', "放棄任務"); sync(); render(); 
        }

        window.onload = () => { render(); };
    </script>
</body>
</html>
